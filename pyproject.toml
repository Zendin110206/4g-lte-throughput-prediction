[project]
name = "4g-lte-throughput-prediction"
version = "0.1.0"
description = "Analysis of 4G LTE radio metrics and machine learning prediction of downlink throughput."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.2",
    "kagglehub>=1.0.2",
    "ruff>=0.16.0",
]
